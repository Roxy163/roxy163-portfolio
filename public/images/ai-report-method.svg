<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">AI产品测评方法摘要</title>
  <desc id="desc">展示21款AI产品测评的测试范围、测试任务和评价维度。</desc>
  <rect width="800" height="500" rx="28" fill="#f7fcfb"/>
  <rect x="28" y="28" width="744" height="444" rx="24" fill="#ffffff" stroke="#cfe6e4" stroke-width="2"/>
  <text x="56" y="78" fill="#0f766e" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="800">测评方法</text>
  <text x="56" y="112" fill="#1f2a37" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="34" font-weight="900">不是比谁最强，而是看任务适配</text>
  <text x="56" y="144" fill="#667686" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16">统一材料和 Prompt，观察不同 AI 产品在真实任务里的优势、失效点和使用成本。</text>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <rect x="56" y="178" width="150" height="88" rx="18" fill="#ecf8f7"/>
    <text x="82" y="216" fill="#0f766e" font-size="30" font-weight="900">21</text>
    <text x="82" y="244" fill="#53606d" font-size="15" font-weight="700">款 AI 产品</text>

    <rect x="226" y="178" width="150" height="88" rx="18" fill="#f8fbff"/>
    <text x="252" y="216" fill="#2f6fb3" font-size="30" font-weight="900">5</text>
    <text x="252" y="244" fill="#53606d" font-size="15" font-weight="700">类工具类型</text>

    <rect x="396" y="178" width="150" height="88" rx="18" fill="#fff7e8"/>
    <text x="422" y="216" fill="#b56b10" font-size="30" font-weight="900">4</text>
    <text x="422" y="244" fill="#53606d" font-size="15" font-weight="700">类测试任务</text>

    <rect x="566" y="178" width="150" height="88" rx="18" fill="#fff3f8"/>
    <text x="592" y="216" fill="#c24174" font-size="30" font-weight="900">7</text>
    <text x="592" y="244" fill="#53606d" font-size="15" font-weight="700">个评价维度</text>
  </g>

  <text x="56" y="310" fill="#1f2a37" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" font-weight="900">测试任务</text>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="800" fill="#245b57">
    <rect x="56" y="332" width="146" height="42" rx="21" fill="#ecf8f7"/>
    <text x="81" y="359">长文总结</text>
    <rect x="218" y="332" width="146" height="42" rx="21" fill="#ecf8f7"/>
    <text x="243" y="359">项目包装</text>
    <rect x="380" y="332" width="146" height="42" rx="21" fill="#ecf8f7"/>
    <text x="405" y="359">功能清单</text>
    <rect x="542" y="332" width="146" height="42" rx="21" fill="#ecf8f7"/>
    <text x="567" y="359">边界说明</text>
  </g>

  <text x="56" y="413" fill="#1f2a37" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" font-weight="900">评价维度</text>
  <text x="56" y="444" fill="#667686" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16">任务完成度 / 结构化能力 / 可执行性 / 边界意识 / 事实可靠性 / 交互成本 / 差异化</text>
</svg>
